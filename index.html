<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B-17</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10; color: #ece8dc; font: 14px/1.5 system-ui, sans-serif; }
      canvas { display: block; }
      body.free-look canvas { cursor: none; } /* the crosshair is the aim point */
      .menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, #0b0d1066, #0b0d10dd); }
      .panel { text-align: center; max-width: 520px; padding: 28px 36px; }
      .panel h1 { font: 600 44px/1.1 Georgia, serif; letter-spacing: 6px; margin: 0 0 10px; }
      .panel p { color: #c8c3b4; margin: 0 0 18px; }
      .panel button { font: 600 16px system-ui; letter-spacing: 2px; padding: 11px 34px; background: #4a5634; color: #f3f0e6; border: 1px solid #9aab74; border-radius: 4px; cursor: pointer; }
      .panel button:hover { background: #5b6a40; }
      .quality { display: block; margin: 18px 0 8px; color: #c8c3b4; }
      .quality select { margin-left: 8px; font: inherit; background: #1b1f17; color: inherit; border: 1px solid #555e45; border-radius: 3px; padding: 3px 6px; }
      .browser-note { font-size: 13px; color: #e8d9a8 !important; margin: 14px 0 0 !important; }
      .browser-note.warn { color: #ffb36a !important; }
      .keys { font-size: 12px; color: #8f8a7d !important; }
      #map { display: none; }
      .map-panel { max-width: none; }
      .map-row { display: flex; gap: 22px; align-items: flex-start; justify-content: center; }
      #map-canvas { width: min(560px, 60vh); height: min(560px, 60vh); border: 1px solid #555e45; border-radius: 4px; cursor: crosshair; }
      #map-side { width: 260px; text-align: left; max-height: 60vh; overflow: auto; }
      #map-side h3 { margin: 0 0 2px; font: 600 15px system-ui; }
      .muted { color: #8f8a7d !important; font-size: 13px; margin: 0 0 10px; }
      button.role { display: flex; justify-content: space-between; align-items: baseline; width: 100%; margin: 0 0 4px; padding: 6px 10px !important; letter-spacing: 0 !important; font: 600 13px system-ui !important; text-align: left; }
      button.role small { font-weight: 400; opacity: .75; margin-left: 10px; }
      button.role:disabled { opacity: .35; cursor: default; background: #2a2f22; }
      #hud { display: none; pointer-events: none; }
      #crosshair { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: #ffffffaa; box-shadow: 0 0 2px #000; }
      #crosshair.gun { width: 26px; height: 26px; margin: -13px; background: none; border: 1.5px solid #ffffff99; }
      #location { position: fixed; left: 18px; top: 14px; font: 600 13px system-ui; letter-spacing: 2px; text-transform: uppercase; color: #ece8dccc; text-shadow: 0 1px 3px #000; }
      #prompt { position: fixed; left: 0; right: 0; bottom: 18%; text-align: center; font-size: 16px; text-shadow: 0 1px 3px #000; opacity: 0; transition: opacity .15s; }
      #prompt b { display: inline-block; min-width: 22px; padding: 1px 6px; margin-right: 6px; border: 1px solid #ece8dc99; border-radius: 3px; background: #0006; }
      #hint { display: none; position: fixed; left: 50%; top: 96px; transform: translateX(-50%); max-width: 70ch; padding: 6px 12px; border-radius: 4px; background: #0b0d10b0; font-size: 13px; text-align: center; }
      #gun { display: none; position: fixed; right: 24px; bottom: 22px; width: 220px; text-align: right; text-shadow: 0 1px 3px #000; }
      #gun-ammo { font: 600 15px ui-monospace, Consolas, monospace; color: #ece8dcbb; }
      #gun-ammo b { font-size: 30px; color: #ece8dc; }
      #gun .bar { height: 5px; margin: 6px 0 2px; background: #0007; border: 1px solid #ece8dc44; border-radius: 2px; overflow: hidden; }
      #gun .bar i { display: block; height: 100%; width: 0; background: #d9d2b8; }
      #gun .bar.reload i { background: #b6d47a; }
      #gun .lbl { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #ece8dc88; }
      #gun-state { min-height: 18px; margin-top: 6px; font-size: 13px; }
      #gun-state.warn { color: #ffb36a; }
      /* hit marker: a red X round the crosshair that pulses out; the killing blow is bigger, brighter and longer */
      #hitmarker { position: fixed; left: 50%; top: 50%; width: 0; height: 0; opacity: 0; }
      #hitmarker i { position: absolute; left: -9px; top: -2px; width: 18px; height: 4px; border-radius: 2px; background: #ff3a2a;
        box-shadow: 0 0 4px #ff3a2acc, 0 0 1px #000; transform-origin: 9px 2px; }
      #hitmarker i:nth-child(1) { transform: rotate(45deg) translateX(17px); }
      #hitmarker i:nth-child(2) { transform: rotate(135deg) translateX(17px); }
      #hitmarker i:nth-child(3) { transform: rotate(225deg) translateX(17px); }
      #hitmarker i:nth-child(4) { transform: rotate(315deg) translateX(17px); }
      #hitmarker.hit { animation: hm .28s ease-out; }
      #hitmarker.kill { animation: hmk .7s ease-out; }
      #hitmarker.kill i { left: -13px; width: 26px; height: 5px; transform-origin: 13px 2.5px; background: #ff2a1a; box-shadow: 0 0 10px #ff2a1a, 0 0 1px #000; }
      @keyframes hm { 0% { opacity: 1; transform: scale(0.8); } 30% { opacity: 1; transform: scale(1.15); } 100% { opacity: 0; transform: scale(1.3); } }
      @keyframes hmk { 0% { opacity: 1; transform: scale(0.7); } 25% { opacity: 1; transform: scale(1.35); } 70% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0; transform: scale(1.5); } }
      #kills { position: fixed; right: 18px; top: 14px; font: 600 13px system-ui; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 1px 3px #000; }
      #toasts { position: fixed; left: 0; right: 0; top: 22%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .toast { padding: 5px 14px; background: #0b0d10a0; border-radius: 3px; font: 600 17px system-ui; letter-spacing: 1px; text-shadow: 0 1px 3px #000; transition: opacity .5s; }
      .toast.kill { color: #ffb36a; }
      .toast.out { opacity: 0; }
      #crew { position: fixed; left: 18px; top: 40px; font: 11px/1.55 system-ui; letter-spacing: .5px; text-shadow: 0 1px 2px #000; color: #ece8dcaa; }
      #crew div { display: flex; justify-content: space-between; gap: 14px; min-width: 190px; }
      #crew b { font-weight: 600; }
      #crew .ok { color: #8fcf6a; } #crew .you { color: #fff; } #crew .busy { color: #d9d2b8; }
      #crew .hurt { color: #ffb36a; animation: blink 1s infinite; } #crew .dead { color: #ff5a4a; }
      #crew div.dead { opacity: .6; text-decoration: line-through; }
      @keyframes blink { 50% { opacity: .35; } }
      #engines { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 6px; }
      .eng { display: inline-flex; flex-direction: column; align-items: center; min-width: 34px; padding: 3px 6px; border: 1px solid #ece8dc55; border-radius: 3px; background: #0b0d1080; font: 600 13px system-ui; }
      .eng small { font-size: 9px; letter-spacing: .5px; min-height: 11px; }
      .eng.smoking { color: #ffd36a; border-color: #ffd36a; } .eng.dead { color: #888; border-color: #666; }
      .eng.fire { color: #ff5a3a; border-color: #ff5a3a; animation: blink .6s infinite; }
      .eng.wing { font-size: 11px; justify-content: center; }
      #aid { display: none; position: fixed; left: 50%; bottom: calc(18% - 22px); width: 220px; transform: translateX(-50%); }
      #aid .bar { height: 6px; background: #0007; border: 1px solid #ece8dc55; border-radius: 2px; overflow: hidden; }
      #aid .bar i { display: block; height: 100%; width: 0; background: #b6d47a; }
      #hurt { display: none; position: fixed; inset: 0; align-items: flex-end; justify-content: center; padding-bottom: 30%; box-shadow: inset 0 0 220px 60px #6a0000; }
      #hurt-text { font: 600 20px system-ui; color: #ffd0c0; text-shadow: 0 1px 4px #000; }
      #mission { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); font: 600 12px system-ui; letter-spacing: 1.5px; text-transform: uppercase; color: #ece8dccc; text-shadow: 0 1px 3px #000; }
      #sight { display: none; position: fixed; inset: 0; }
      #sight .ring { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, transparent 0 34vmin, #000 34.3vmin); }
      #sight .h, #sight .v { position: absolute; left: 50%; top: 50%; background: #1a1a1acc; }
      #sight .h { width: 68vmin; height: 1px; transform: translate(-50%, 0); }
      #sight .v { width: 1px; height: 68vmin; transform: translate(0, -50%); }
      #sight-info { position: absolute; left: 0; right: 0; bottom: 6%; text-align: center; font-size: 14px; line-height: 1.6; text-shadow: 0 1px 3px #000; }
      .debrief { margin: 0 auto 6px; border-collapse: collapse; font-size: 14px; text-align: left; }
      .debrief td { padding: 3px 12px; border-bottom: 1px solid #ece8dc22; }
      .debrief td:last-child { text-align: right; color: #ece8dc; }
      #health { position: fixed; left: 50%; bottom: 58px; width: 260px; transform: translateX(-50%); text-align: center; text-shadow: 0 1px 3px #000; }
      #health .bar, #flight .bar { height: 7px; margin: 2px 0; background: #0007; border: 1px solid #ece8dc55; border-radius: 2px; overflow: hidden; }
      #health .bar i, #flight .bar i { display: block; height: 100%; width: 100%; background: #8fcf6a; transition: width .3s; }
      #health .lbl, #flight .lbl { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: #ece8dc99; }
      #health-pct { font-size: 11px; color: #ece8dccc; }
      #flight { display: none; position: fixed; left: 18px; bottom: 22px; width: 210px; font: 13px/1.5 ui-monospace, Consolas, monospace; text-shadow: 0 1px 3px #000; }
      #flight b { font-size: 16px; }
      #nose { display: none; position: fixed; width: 18px; height: 18px; margin: -9px; border: 2px solid #b6ff9acc; border-radius: 50%; box-shadow: 0 0 2px #000; }
      #nose::after { content: ''; position: absolute; left: 6px; top: 6px; width: 2px; height: 2px; background: #b6ff9a; }
      .roles { display: flex; gap: 10px; justify-content: center; margin: 4px 0 6px; flex-wrap: wrap; }
      .roles .role-btn { display: flex; flex-direction: column; align-items: center; min-width: 150px; padding: 10px 14px; letter-spacing: 0; }
      .roles .role-btn b { font: 600 15px system-ui; letter-spacing: 1px; }
      .roles .role-btn small { font-size: 11px; opacity: .8; margin-top: 3px; max-width: 160px; }
      .roles .role-btn.bf109 { background: #4d4f52; border-color: #9a9ea4; }
      .roles .role-btn.p51 { background: #3a4a66; border-color: #8aa4d4; }
      .roles.small { margin-top: 12px; }
      .roles.small .role-btn { min-width: 120px; padding: 6px 10px; }
      #hud[data-mode="fighter"] #crew, #hud[data-mode="fighter"] #engines, #hud[data-mode="fighter"] #gun { display: none !important; }
      #hud[data-mode="fighter"] #health { bottom: 22px; }
      #flight .warn { color: #ffb36a; }
      #gunsight { display: none; position: fixed; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px; border: 2px solid #ffb34aaa; border-radius: 50%; box-shadow: 0 0 6px #ff9a2a66; }
      #gunsight::before, #gunsight::after { content: ''; position: absolute; background: #ffb34aaa; }
      #gunsight::before { left: 50%; top: 10px; bottom: 10px; width: 2px; margin-left: -1px; }
      #gunsight::after { top: 50%; left: 10px; right: 10px; height: 2px; margin-top: -1px; }
      #gunsight i { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #ffb34a; }
      #lifestats { position: fixed; right: 18px; top: 34px; font: 12px system-ui; color: #ece8dccc; text-shadow: 0 1px 3px #000; }
      #lifestats b { color: #fff; }
      #banners { position: fixed; left: 0; right: 0; top: 13%; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
      .banner { min-width: 360px; padding: 7px 26px 8px; text-align: center; text-shadow: 0 1px 3px #000;
        background: linear-gradient(90deg, transparent, #0b0d10ee 18%, #0b0d10ee 82%, transparent); border-top: 1px solid #ffcf6a55; border-bottom: 1px solid #ffcf6a55;
        animation: bannerIn .25s ease-out; transition: opacity .6s, transform .6s; }
      .banner .head { font: 800 21px system-ui; letter-spacing: 4px; color: #ffd36a; text-shadow: 0 0 8px #ff9a2a88, 0 1px 2px #000; }
      .banner .sub { font: 600 14px system-ui; letter-spacing: 1px; color: #ece8dc; }
      .banner .pts { margin-left: 12px; color: #b6ff9a; }
      .banner.assist .head { font-size: 16px; color: #9ad0ff; }
      .banner.crit { min-width: 260px; padding: 4px 20px; }
      .banner.crit .head { font-size: 14px; color: #ff9a6a; letter-spacing: 3px; }
      .banner.crit .sub { font-size: 12px; }
      .banner.out { opacity: 0; transform: translateY(-8px); }
      @keyframes bannerIn { from { opacity: 0; transform: scale(1.15); } to { opacity: 1; transform: none; } }
      #ejectcard { display: none; position: fixed; right: 18px; bottom: 22px; }
      .lifecard { padding: 10px 14px; background: #0b0d10b8; border: 1px solid #ece8dc33; border-radius: 4px; font-size: 13px; text-align: left; }
      .lifecard .lbl { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #ece8dc99; margin-bottom: 4px; }
      .lifecard td { padding: 1px 10px 1px 0; color: #ece8dcbb; } .lifecard td:nth-child(even) { color: #fff; font-weight: 600; padding-right: 18px; }
      .menu .lifecard { display: inline-block; margin: 0 0 14px; }
      #hud[data-mode="eject"] #crew, #hud[data-mode="eject"] #engines, #hud[data-mode="eject"] #gun, #hud[data-mode="eject"] #flight,
      #hud[data-mode="eject"] #health, #hud[data-mode="eject"] #crosshair, #hud[data-mode="eject"] #nose, #hud[data-mode="eject"] #gunsight,
      #hud[data-mode="eject"] #prompt { display: none !important; }
      #forces { position: fixed; left: 50%; top: 30px; transform: translateX(-50%); font: 11px/1.5 system-ui; color: #ece8dcaa; text-shadow: 0 1px 2px #000;
        background: #0b0d1066; padding: 3px 10px; border-radius: 3px; white-space: nowrap; }
      #forces b { color: #fff; margin-right: 2px; } #forces i { font-style: normal; }
      #forces .side { display: inline-block; min-width: 46px; font-weight: 700; letter-spacing: 1px; }
      #forces .side.us { color: #7ab8ff; } #forces .side.them { color: #ff7a6a; }
      #forces .ok { color: #8fcf6a; } #forces .dmg { color: #ffd36a; } #forces .down { color: #ff6a5a; } #forces .air { color: #ece8dc; }
      #fps { display: none; position: fixed; right: 12px; top: 10px; font: 12px ui-monospace, Consolas, monospace; color: #b6ff9a; text-shadow: 0 1px 2px #000; }
    </style>
  </head>
  <body>
    <div id="ui"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
