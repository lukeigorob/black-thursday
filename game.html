<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Bomber Seat Prototype</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:Consolas,monospace;color:#fff}
body.play{cursor:none}
canvas{display:block}
#hud2d{position:fixed;inset:0;pointer-events:none}
#hud{position:fixed;left:12px;top:10px;font-size:14px;text-shadow:0 0 3px #000;pointer-events:none;line-height:1.6}
.bar{width:150px;height:8px;background:#0006;border:1px solid #fff8;display:inline-block;vertical-align:middle;margin-left:6px}
.bar i{display:block;height:100%}
#msg{position:fixed;top:18%;width:100%;text-align:center;font-size:22px;text-shadow:0 0 4px #000;pointer-events:none}
#dmg{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 160px #f00;opacity:0;transition:opacity .4s}
#ov{position:fixed;inset:0;background:#000c;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:default}

#ov button{font:15px Consolas,monospace;margin:3px;padding:7px 12px;background:#3a4128;color:#fff;border:1px solid #9a8;cursor:pointer;min-width:210px}
#ov button:hover:not(:disabled){background:#5a6638}
#ov button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:24px;align-items:flex-start;justify-content:center}
#map{position:relative;width:440px;height:340px;background:#1d2416;border:1px solid #9a8}
#map i{position:absolute;width:12px;height:12px;margin:-7px;border:1px solid #000;cursor:pointer}
#map i.sel{outline:2px solid #fff;outline-offset:2px}
#map i.me{box-shadow:0 0 0 5px #fd8}
#map .fwd{position:absolute;top:4px;left:0;right:0;color:#9a8;font-size:12px}
#seats{min-width:230px;text-align:left}
</style></head><body>
<canvas id="hud2d"></canvas><div id="hud"></div><div id="msg"></div><div id="dmg"></div><div id="ov"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const V = THREE.Vector3, D = Math.PI / 180, rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), $ = id => document.getElementById(id);

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const SKY = 0x84b6e6;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 1800, 10000);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.03, 14000);
camera.rotation.order = 'YXZ';
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xe8f2ff, 0x556644, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(300, 800, 200); scene.add(sun);
const SPEED = 80; // formation airspeed: the world scrolls past at this rate (+z)

// ground: procedural patchwork fields
const cv = document.createElement('canvas'); cv.width = cv.height = 256;
const g2 = cv.getContext('2d');
const FIELD = ['86,120,60', '110,140,70', '135,125,85', '70,100,55', '120,130,60'];
for (let i = 0; i < 16; i++) for (let j = 0; j < 16; j++) { g2.fillStyle = `rgb(${FIELD[Math.random() * 5 | 0]})`; g2.fillRect(i * 16, j * 16, 16, 16); }
const gtex = new THREE.CanvasTexture(cv); gtex.wrapS = gtex.wrapT = THREE.RepeatWrapping; gtex.repeat.set(60, 60);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40000, 40000), new THREE.MeshLambertMaterial({ map: gtex }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -3500; scene.add(ground);

const sph = new THREE.SphereGeometry(1, 10, 8);
const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x888888 });
const clouds = [];
for (let i = 0; i < 40; i++) {
  const c = new THREE.Group();
  for (let k = 0, n = 4 + Math.random() * 5 | 0; k < n; k++) {
    const m = new THREE.Mesh(sph, cloudMat), s = rnd(40, 100);
    m.scale.set(s * 1.4, s * 0.6, s); m.position.set(rnd(-100, 100), rnd(-15, 15), rnd(-60, 60)); c.add(m);
  }
  c.position.set(rnd(-4000, 4000), Math.random() < 0.3 ? rnd(300, 600) : rnd(-1000, -300), rnd(-6000, 1500));
  scene.add(c); clouds.push(c);
}

// ---------- model helpers ----------
const mats = {};
const mat = c => mats[c] || (mats[c] = new THREE.MeshLambertMaterial({ color: c }));
function box(w, h, d, c, x, y, z, parent) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c)); m.position.set(x, y, z); parent.add(m); return m;
}
function rod(parent, a, b, r, c) { // cylinder from a to b (parent-local)
  const d = new V().subVectors(b, a);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 8), mat(c));
  m.position.copy(a).add(b).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(new V(0, 1, 0), d.normalize());
  parent.add(m); return m;
}
const v3 = (x, y, z) => new V(x, y, z);
// merge many coloured parts into one geometry = one draw call per plane
function mergeParts(parts) {
  const pos = [], nor = [], col = [], c = new THREE.Color(), m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  for (const [geo, color, x = 0, y = 0, z = 0, rx = 0, sx = 1, sy = 1, sz = 1] of parts) {
    const g = geo.toNonIndexed();
    m.compose(v3(x, y, z), q.setFromEuler(e.set(rx, 0, 0)), v3(sx, sy, sz)); g.applyMatrix4(m);
    const p = g.attributes.position.array, n = g.attributes.normal.array; c.set(color);
    for (let i = 0; i < p.length; i++) { pos.push(p[i]); nor.push(n[i]); }
    for (let i = 0; i < p.length / 3; i++) col.push(c.r, c.g, c.b);
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  return out;
}
const BG = new THREE.BoxGeometry(1, 1, 1), CYL = new THREE.CylinderGeometry(1, 1, 1, 10);
const VC = new THREE.MeshLambertMaterial({ vertexColors: true });
const OD = 0x5b5f3a, GLASS = 0x9fc3d9;
const B17_GEO = mergeParts([ // nose points -z
  [BG, OD, 0, 0, 0, 0, 2.4, 2.6, 22],
  [BG, OD, 0, 0.6, 12, 0, 1.4, 1.3, 2.4],          // tail gunner's compartment
  [BG, GLASS, 0, -0.2, -11.8, 0, 1.9, 1.9, 2],     // nose glass
  [BG, GLASS, 0, 1.52, -9.6, 0, 1.6, 0.45, 2.2],   // cockpit canopy
  [BG, OD, 0, 0.2, -2, 0, 32, 0.5, 4],
  [BG, OD, 0, 0.6, 10.5, 0, 11, 0.3, 2.5],
  [BG, OD, 0, 3, 9.8, 0, 0.4, 5, 4],
  ...[-11, -5, 5, 11].map(x => [CYL, 0x444444, x, 0.1, -4.6, Math.PI / 2, 0.8, 3.2, 0.8]),
  [sph, GLASS, 0, 1.4, -4, 0, 0.9, 0.6, 0.9],
  [sph, 0x333333, 0, -1.6, 1],
  [CYL, 0xffffff, -11, 0.2, -2, 0, 1.3, 0.54, 1.3], [CYL, 0x223366, -11, 0.2, -2, 0, 0.6, 0.56, 0.6],
]);
const fighterGeo = (body, nose, mark) => mergeParts([ // nose points +z (for lookAt)
  [BG, body, 0, 0, 0, 0, 1.1, 1.2, 8.5], [BG, body, 0, -0.3, 0.8, 0, 10, 0.2, 1.8],
  [BG, body, 0, 0.2, -3.8, 0, 3.6, 0.15, 1], [BG, body, 0, 0.9, -3.8, 0, 0.15, 1.4, 1.2],
  [BG, nose, 0, 0, 4.3, 0, 1.15, 1.25, 1], [BG, 0x88aacc, 0, 0.75, 0.6, 0, 0.7, 0.5, 1.4],
  [BG, mark, -3.6, -0.3, 0.8, 0, 1, 0.22, 1], [BG, mark, 3.6, -0.3, 0.8, 0, 1, 0.22, 1],
]);
const ENEMY_GEO = fighterGeo(0x6b7470, 0xe8c020, 0x111111), ESCORT_GEO = fighterGeo(0xb8bcc0, 0x2244aa, 0xffffff);

// ---------- seats ----------
// by = base yaw (0 = forward), yl = yaw limit either side (PI = free)
const SEATS = [
  { n: 'Tail gun', k: 'tail', p: [0, 0.6, 12.3], by: Math.PI, yl: 35 * D, pmin: -30 * D, pmax: 30 * D, gun: 1 },
  { n: 'Ball turret', k: 'ball', p: [0, -1.6, 1], by: 0, yl: Math.PI, pmin: -89 * D, pmax: 0, gun: 1 },
  { n: 'Top turret', k: 'top', p: [0, 1.85, -4], by: 0, yl: Math.PI, pmin: -5 * D, pmax: 85 * D, gun: 1 },
  { n: 'Left waist', k: 'waist', p: [-0.8, 0.4, 5], by: Math.PI / 2, yl: 55 * D, pmin: -40 * D, pmax: 40 * D, gun: 1 },
  { n: 'Right waist', k: 'waist', p: [0.8, 0.4, 5], by: -Math.PI / 2, yl: 55 * D, pmin: -40 * D, pmax: 40 * D, gun: 1 },
  { n: 'Chin turret', k: 'chin', p: [0, -0.3, -11.6], by: 0, yl: 50 * D, pmin: -45 * D, pmax: 15 * D, gun: 1 },
  { n: 'Pilot', k: 'pilot', p: [-0.6, 0.95, -9.6], by: 0, yl: 110 * D, pmin: -35 * D, pmax: 40 * D, gun: 0 },
];

// ---------- the combat box: 3 squadrons x 4 elements x 3-ship vics = 36 B-17s ----------
const NAMES = ['Sally B', 'Memphis Dame', 'Lucky Lady', "Rosie's Riveters", "Hell's Angel", 'Flak Bait', 'Little Miss Mischief',
  'Bad Penny', 'Hang the Expense', 'Lady Luck', 'Nine-O-Nine', 'Shoo Shoo Baby'];
const VIC = [[0, 0, 0], [-36, -6, 22], [36, 6, 22]], ELEM = [[0, 0, 0], [95, 12, 45], [-95, -12, 45], [0, -28, 95]];
const SQN = [[0, 0, 0, 'Lead'], [300, 70, 140, 'High'], [-300, -70, 140, 'Low']];
const bombers = [], decor = [];
for (const s of SQN) for (const e of ELEM) for (const v of VIC) {
  const i = bombers.length, m = new THREE.Mesh(B17_GEO, VC);
  const base = v3(s[0] + e[0] + v[0], s[1] + e[1] + v[1], s[2] + e[2] + v[2] - 170);
  m.position.copy(base); scene.add(m);
  bombers.push({ i, m, base, name: `${NAMES[i % 12]} (${s[3]} sqn)`, nudge: new V(), hp: 150, alive: true, vy: 0,
    roll: Math.random() < 0.5 ? -1 : 1, smokeT: 0, gone: 0, props: [-11, -5, 5, 11].map(x => box(3.4, 0.15, 0.15, 0x222222, x, 0.1, -6.3, m)),
    seats: SEATS.map(() => ({ cd: Math.random(), burst: 0 })) });
  // a second combat box far ahead, for scale
  const d = new THREE.Mesh(B17_GEO, VC); d.position.copy(base).add(v3(-250, 180, -2400)); scene.add(d); decor.push(d);
}
const seatPos = (b, si, out = new V()) => b.m.localToWorld(out.set(...SEATS[si].p));
const aliveBombers = () => bombers.filter(b => b.alive);

// ---------- crew stations: interiors, guns, gloved hands ----------
const INT = 0x6f7553, MET = 0x2b2b2b, GLOVE = 0x4a3020, SLEEVE = 0x5a4632, FRAME = 0x333333, GUNM = 0x1c1c1c, FLOOR = 0x4a4a3a;
const reticleTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  x.strokeStyle = x.fillStyle = '#ff7a1a'; x.lineWidth = 5;
  x.beginPath(); x.arc(64, 64, 46, 0, 7); x.stroke(); x.beginPath(); x.arc(64, 64, 4, 0, 7); x.fill();
  for (const [a, b, c2, d] of [[64, 8, 64, 30], [64, 98, 64, 120], [8, 64, 30, 64], [98, 64, 120, 64]]) { x.beginPath(); x.moveTo(a, b); x.lineTo(c2, d); x.stroke(); }
  return new THREE.CanvasTexture(c);
})();
function hand(g0, x, y, z, side) { // glove gripping a vertical handle at x,y,z; sleeve runs back toward the gunner
  const g = new THREE.Group(); g.position.set(x, y, z); g0.add(g);
  box(0.085, 0.1, 0.05, GLOVE, 0, 0, 0.035, g);
  for (let k = 0; k < 4; k++) box(0.08, 0.021, 0.035, GLOVE, 0, -0.036 + k * 0.024, -0.025, g);
  box(0.03, 0.03, 0.07, GLOVE, -side * 0.03, 0.065, 0, g);
  rod(g, v3(0, -0.02, 0.05), v3(side * 0.06, -0.09, 0.2), 0.048, GLOVE);
  rod(g, v3(side * 0.06, -0.09, 0.2), v3(side * 0.22, -0.5, 0.62), 0.07, SLEEVE);
}
function gun(g, x, y, z, len) { // .50 cal: receiver, cooling jacket, barrel. returns muzzle position
  box(0.075, 0.1, 0.5, GUNM, x, y, z - 0.25, g);
  rod(g, v3(x, y + 0.01, z - 0.5), v3(x, y + 0.01, z - 0.5 - len * 0.4), 0.032, 0x333333);
  rod(g, v3(x, y + 0.01, z - 0.5), v3(x, y + 0.01, z - 0.5 - len), 0.015, GUNM);
  return v3(x, y + 0.01, z - 0.5 - len);
}
function grip(g, x, y, z, side) { rod(g, v3(x, y - 0.06, z), v3(x, y + 0.06, z), 0.017, GUNM); hand(g, x, y, z, side); }
function sight(g) { // reflector sight centred on the view axis
  rod(g, v3(0, -0.16, -0.7), v3(0, -0.06, -0.7), 0.012, MET); box(0.13, 0.02, 0.05, MET, 0, -0.065, -0.7, g);
  const s = new THREE.Mesh(new THREE.PlaneGeometry(0.11, 0.11), new THREE.MeshBasicMaterial({ map: reticleTex, transparent: true,
    depthWrite: false, fog: false }));
  s.position.set(0, 0, -0.7); g.add(s);
}
function wallHole(g, W, H, hx0, hx1, hy0, hy1, z, c, cx = 0, cy = 0) { // wall in the XY plane with a window cut out
  const x0 = cx - W / 2, x1 = cx + W / 2, y0 = cy - H / 2, y1 = cy + H / 2;
  const slab = (a, b, c0, d) => box(b - a, d - c0, 0.04, c, (a + b) / 2, (c0 + d) / 2, z, g);
  slab(x0, x1, y0, hy0); slab(x0, x1, hy1, y1); slab(x0, hx0, hy0, hy1); slab(hx1, x1, hy0, hy1);
  for (const [a, b] of [[v3(hx0, hy0, z), v3(hx1, hy0, z)], [v3(hx0, hy1, z), v3(hx1, hy1, z)], [v3(hx0, hy0, z), v3(hx0, hy1, z)], [v3(hx1, hy0, z), v3(hx1, hy1, z)]])
    rod(g, a, b, 0.025, FRAME);
}
function buildRig(k) { // attached to the camera: moves with your aim
  const r = new THREE.Group(), mz = []; r.rotation.order = 'YXZ';
  if (k === 'waist') {
    mz.push(gun(r, 0, -0.17, -0.6, 1.4)); box(0.17, 0.03, 0.04, GUNM, 0, -0.22, -0.55, r);
    grip(r, -0.08, -0.27, -0.53, -1); grip(r, 0.08, -0.27, -0.53, 1); sight(r);
  } else if (k === 'ball') {
    const sh = new THREE.Mesh(new THREE.SphereGeometry(0.75, 24, 16, 0, Math.PI * 2, 0.65, Math.PI - 0.65),
      new THREE.MeshLambertMaterial({ color: 0x3a3d38, side: THREE.BackSide }));
    sh.rotation.x = -Math.PI / 2; r.add(sh);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.454, 0.03, 6, 24), mat(FRAME)); ring.position.z = -0.6; r.add(ring);
    for (const y of [-0.22, 0.22]) rod(r, v3(-0.42, y, -0.6), v3(0.42, y, -0.6), 0.015, FRAME);
    for (const x of [-0.32, 0.32]) mz.push(gun(r, x, -0.06, -0.35, 1.5));
    rod(r, v3(-0.2, -0.22, -0.42), v3(0.2, -0.22, -0.42), 0.015, GUNM);
    grip(r, -0.2, -0.28, -0.42, -1); grip(r, 0.2, -0.28, -0.42, 1); sight(r);
  } else if (k !== 'pilot') {
    for (const x of [-0.24, 0.24]) mz.push(gun(r, x, -0.27, -0.75, 1.4));
    grip(r, -0.24, -0.38, -0.72, -1); grip(r, 0.24, -0.38, -0.72, 1); sight(r);
  }
  let flash = null;
  if (mz.length) { flash = new THREE.Mesh(sph, new THREE.MeshBasicMaterial({ color: 0xffc060, fog: false })); flash.scale.setScalar(0.08); flash.visible = false; r.add(flash); }
  return { r, mz, flash };
}
function buildFixed(k) { // attached to the bomber, in seat space (forward = -z)
  const g = new THREE.Group();
  if (k === 'waist') {
    wallHole(g, 4, 2.6, -0.8, 0.8, -0.25, 0.55, -0.42, INT, 0, -0.4);
    box(4, 2.6, 0.05, INT, 0, -0.4, 1.95, g); box(4, 0.05, 2.4, FLOOR, 0, -1.55, 0.77, g); box(4, 0.05, 2.4, INT, 0, 0.88, 0.77, g);
    box(0.05, 2.6, 2.4, INT, -2, -0.4, 0.77, g); box(0.05, 2.6, 2.4, INT, 2, -0.4, 0.77, g);
    for (const x of [-1.6, -1.15, 1.15, 1.6]) box(0.06, 2.5, 0.06, 0x5c6146, x, -0.4, -0.37, g);
    box(0.4, 0.3, 0.25, 0x3d4a2a, 0.6, -1.38, -0.1, g); rod(g, v3(0, -1.55, -0.3), v3(0, -0.3, -0.45), 0.03, MET);
  } else if (k === 'tail') {
    wallHole(g, 1.2, 1.2, -0.5, 0.5, -0.35, 0.45, -0.75, INT);
    box(0.04, 1.2, 1.4, INT, -0.6, 0, -0.05, g); box(0.04, 1.2, 1.4, INT, 0.6, 0, -0.05, g);
    box(1.2, 0.04, 1.4, INT, 0, 0.6, -0.05, g); box(1.2, 0.04, 1.4, FLOOR, 0, -0.6, -0.05, g); box(1.2, 1.2, 0.04, INT, 0, 0, 0.62, g);
    box(0.9, 0.22, 0.03, 0x555555, 0, -0.47, -0.72, g);
  } else if (k === 'chin') {
    for (const y of [0.45, -0.55]) rod(g, v3(-0.9, y, -0.95), v3(0.9, y, -0.95), 0.025, FRAME);
    for (const x of [-0.9, 0.9]) {
      rod(g, v3(x, -0.55, -0.95), v3(x, 0.45, -0.95), 0.025, FRAME);
      rod(g, v3(x, 0.45, -0.95), v3(x, 0.45, 0.8), 0.025, FRAME); rod(g, v3(x, -0.55, -0.95), v3(x, -0.55, 0.8), 0.025, FRAME);
    }
    box(1.8, 0.05, 1.8, FLOOR, 0, -0.85, 0, g); box(1.9, 1.9, 0.05, INT, 0, -0.1, 1, g);
    box(0.18, 0.25, 0.25, 0x333333, 0, -0.72, -0.55, g); rod(g, v3(0, -0.6, -0.55), v3(0, -0.45, -0.62), 0.04, 0x444444); // Norden sight
  } else if (k === 'pilot') {
    rod(g, v3(-0.65, -0.25, -1), v3(1.85, -0.25, -1), 0.03, FRAME); rod(g, v3(-0.65, 0.3, -1), v3(1.85, 0.3, -1), 0.03, FRAME);
    for (const x of [-0.65, 0.6, 1.85]) rod(g, v3(x, -0.25, -1), v3(x, 0.3, -1), 0.035, FRAME);
    for (const x of [-0.65, 1.85]) {
      rod(g, v3(x, 0.3, -1), v3(x, 0.3, 0.8), 0.03, FRAME); rod(g, v3(x, -0.25, -1), v3(x, -0.25, 0.8), 0.03, FRAME);
      rod(g, v3(x, -0.25, 0), v3(x, 0.3, 0), 0.03, FRAME); box(0.05, 0.9, 1.8, INT, x, -0.7, -0.1, g);
    }
    box(2.55, 0.05, 1.9, INT, 0.6, 0.33, -0.05, g); box(2.55, 1.5, 0.05, INT, 0.6, -0.4, 0.85, g); box(2.55, 0.05, 1.9, FLOOR, 0.6, -1.15, -0.05, g);
    box(2.5, 0.45, 0.08, 0x2a2a2a, 0.6, -0.47, -0.85, g); box(2.5, 0.06, 0.25, 0x1a1a1a, 0.6, -0.22, -0.9, g);
    for (let row = 0; row < 2; row++) for (let c = 0; c < 8; c++) {
      const x = -0.5 + c * 0.16 + (c > 3 ? 0.35 : 0), y = -0.36 - row * 0.17;
      const gz = new THREE.Mesh(CYL, mat(0xd8d8d0)); gz.scale.set(0.05, 0.02, 0.05); gz.rotation.x = Math.PI / 2; gz.position.set(x, y, -0.8); g.add(gz);
      box(0.006, 0.04, 0.005, 0x111111, x, y + 0.012, -0.788, g);
    }

    hx.moveTo(s[0] + h - 5, s[1] + h); hx.lineTo(s[0] + h, s[1] + h); hx.lineTo(s[0] + h, s[1] + h - 5); hx.stroke();
    if (d < 1500) { hx.fillStyle = '#ff8a7a'; hx.fillText(`${d | 0}m`, s[0] + h + 3, s[1] + 4); }
    const sd = Math.hypot(s[0] - ax, s[1] - ay);
    if (S.gun && d < 1000 && sd < ld && sd < 220) { ld = sd; lead = { f, s, d }; }
  }
  for (const e of escorts) {
    if (e.p.distanceTo(camera.position) > 1500) continue;
    const s = toScreen(e.p); if (!s) continue;
    hx.strokeStyle = '#6ab0ff'; hx.beginPath(); hx.moveTo(s[0], s[1] - 6); hx.lineTo(s[0] + 6, s[1]); hx.lineTo(s[0], s[1] + 6); hx.lineTo(s[0] - 6, s[1]); hx.closePath(); hx.stroke();
  }
  if (lead) { // where to aim so the bullets meet the fighter
    let t = lead.d / 900;
    _pr.copy(lead.f.p).addScaledVector(lead.f.v, t); t = _pr.distanceTo(camera.position) / 900;
    _pr.copy(lead.f.p).addScaledVector(lead.f.v, t);
    const s2 = toScreen(_pr);
    if (s2) {
      hx.strokeStyle = '#ffe36a88'; hx.beginPath(); hx.moveTo(lead.s[0], lead.s[1]); hx.lineTo(s2[0], s2[1]); hx.stroke();
      hx.strokeStyle = '#ffe36a'; hx.lineWidth = 2; hx.beginPath(); hx.arc(s2[0], s2[1], 7, 0, 7); hx.stroke(); hx.lineWidth = 1.5;
    }
  }
  if (S.gun) { // the crosshair is the mouse
    hx.strokeStyle = hitT > 0 ? '#ff3030' : '#fff6d0'; hx.lineWidth = hitT > 0 ? 3 : 1.5;
    hx.beginPath(); hx.arc(ax, ay, 12, 0, 7);
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { hx.moveTo(ax + dx * 16, ay + dy * 16); hx.lineTo(ax + dx * 26, ay + dy * 26); }
    hx.stroke(); hx.fillStyle = hx.strokeStyle; hx.fillRect(ax - 1.5, ay - 1.5, 3, 3);
  }
}

// ---------- menus / input ----------
function lock() {
  const c = renderer.domElement;
  try { const r = c.requestPointerLock(); if (r && r.catch) r.catch(lockFailed); } catch (e) { lockFailed(); }
}
function lockFailed() { if (!freeAim) { freeAim = true; showMsg('Mouse capture unavailable: free-cursor aiming', 3); } }
function overlay(html) { $('ov').innerHTML = html; $('ov').style.display = 'flex'; }
function hideOverlay() { $('ov').style.display = 'none'; }
function resume() { state = 'play'; hideOverlay(); if (!freeAim) lock(); }
function pause() {
  state = 'pause'; P.firing = false;
  overlay('<h1>PAUSED</h1><button id="res">Resume</button>'); $('res').onclick = resume;
}
let sel = 0, menuDead = false, menuTitle = '';
function nearestAlive(p) { let best = null, bd = 1e9; for (const b of aliveBombers()) { const d = b.base.distanceTo(p); if (d < bd) { bd = d; best = b; } } return best; }
function seatMenu(title, dead) {
  state = 'menu'; menuTitle = title; menuDead = dead; P.firing = false;
  if (document.pointerLockElement) document.exitPointerLock();
  sel = P.b; renderMenu();
}
function renderMenu() {
  const sb = bombers[sel].alive ? bombers[sel] : nearestAlive(bombers[sel].base); if (!sb) return;
  sel = sb.i;
  let h = `<h1>${menuTitle}</h1><p>${menuDead ? 'The battle goes on without you. ' : ''}Every seat in the formation is crewed. ` +
    `Pick a bomber on the map, then take over any AI-held seat.</p><div class="row"><div id="map"><span class="fwd">▲ direction of flight</span>`;
  for (const b of aliveBombers()) {
    const hp = b.hp / 150;
    h += `<i data-b="${b.i}" class="${b.i === sel ? 'sel' : ''} ${b.i === P.b ? 'me' : ''}" style="left:${220 + b.base.x * 0.45}px;` +
      `top:${190 + (b.base.z + 40) * 0.9}px;background:${hp > 0.6 ? '#7c5' : hp > 0.3 ? '#ec4' : '#e53'}" title="${b.name}"></i>`;
  }
  h += `</div><div id="seats"><b style="color:#fd8">${sb.name}</b><br>Airframe ${Math.max(0, sb.hp / 1.5) | 0}%<br><br>`;
  SEATS.forEach((S, si) => {
    const mine = !P.dead && sb.i === P.b && si === P.s;
    h += `<button data-s="${si}" ${mine ? 'disabled' : ''}>${S.n}${mine ? ' (you)' : ''}</button><br>`;
  });
  h += (menuDead ? '' : '<br><button id="stay">Back to my seat</button>') + '<p>SPACE: take the tail gun of the selected bomber</p></div></div>';
  overlay(h);
  $('ov').querySelectorAll('#map i').forEach(d => d.onclick = () => { sel = +d.dataset.b; renderMenu(); });
  $('ov').querySelectorAll('button[data-s]').forEach(btn => btn.onclick = () => takeSeat(sel, +btn.dataset.s));
  if (!menuDead) $('stay').onclick = resume;
}
function takeSeat(bi, si) {
  if (!bombers[bi].alive) return renderMenu();
  const S = SEATS[si];
  Object.assign(P, { b: bi, s: si, yaw: 0, pitch: clamp(0, S.pmin, S.pmax), dead: false, hp: 100, heat: 0, overheat: false });
  buildStation(bombers[bi], si); resume();
  showMsg(`You take over the ${S.n.toLowerCase()} on ${bombers[bi].name}`, 2.5);
}
function gameOver() {
  P.lost = true; state = 'over'; if (document.pointerLockElement) document.exitPointerLock();
  overlay(`<h1>FORMATION LOST</h1><p>You survived to wave ${wave} and shot down ${kills} fighters.</p><button onclick="location.reload()">Fly again</button>`);
}
buildStation(bombers[P.b], P.s);
overlay(`<h1>BOMBER SEAT</h1><p>A combat box of 36 B-17s, every gun crewed. Defend the formation from enemy fighters.
  When you die, jump into any AI-held seat in the box and keep fighting.</p>
  <p>Mouse: aim (the mouse is the crosshair) · Hold left click: fire · Follow the yellow lead circle<br>
  TAB: change seat · M: switch mouse mode · ESC: pause</p><button id="go">Start mission</button>`);
$('go').onclick = resume;

document.addEventListener('pointerlockchange', () => { if (!document.pointerLockElement && state === 'play' && !freeAim) pause(); });
document.addEventListener('pointerlockerror', lockFailed);
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement) { // captured: mouse turns the view, crosshair stays centred
    if (state !== 'play' || P.dead) return;
    P.yaw -= e.movementX * 0.0022; P.pitch -= e.movementY * 0.0022; clampAim();
  } else { mouse.x = e.clientX / innerWidth * 2 - 1; mouse.y = -(e.clientY / innerHeight * 2 - 1); }
});
renderer.domElement.addEventListener('mousedown', e => {
  if (e.button !== 0 || state !== 'play') return;
  if (!freeAim && !document.pointerLockElement) return lock();
  P.firing = true;
});
document.addEventListener('mouseup', e => { if (e.button === 0) P.firing = false; });
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Tab') { e.preventDefault(); if (state === 'play') seatMenu(P.dead ? 'Choose a seat' : 'Change seat', P.dead); }
  if (e.code === 'Space' && state === 'menu') { e.preventDefault(); takeSeat(sel, 0); }
  if (e.code === 'Escape' && state === 'play' && freeAim) pause();
  if (e.code === 'KeyM' && state === 'play') {
    freeAim = !freeAim;
    if (freeAim) { mouse.x = mouse.y = 0; if (document.pointerLockElement) document.exitPointerLock(); } else lock();
    showMsg(freeAim ? 'Free cursor: the crosshair follows your mouse' : 'Captured mouse: the mouse turns the guns', 2);
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); sizeHud(); });

// ---------- main loop ----------
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (state === 'play' || state === 'menu') { updateWorld(dt); updateFighters(dt); updateEscorts(dt); updateGunners(dt); updateBullets(dt); }
  updatePlayer(dt); updateHud(dt);
  renderer.render(scene, camera);
  drawHud();
}
loop();
</script>
</body></html>
